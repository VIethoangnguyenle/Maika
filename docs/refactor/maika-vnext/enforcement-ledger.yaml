  # ---- change-level Loop Engineer (W6): evidence-backed change loops ----
  - id: ENF-023
    mechanism: change-loop-scope-escape
    type: gate
    status: active
    failure:
      classification: reproducible_litmus
      summary: >-
        A worker writing outside the declared lightweight scope opens exactly one
        evidence-backed change loop (root_cause implementation_gap → implementer);
        the happy path opens none.
      litmus:
        command: /usr/bin/python3 -m pytest ".maika/tools/microloop-orchestrator/tests/test_vnext_cli_e2e.py::test_scope_escape_opens_one_change_loop" -q
    implementation:
      files:
        - .maika/tools/microloop-orchestrator/loop_policy.py
        - .maika/tools/microloop-orchestrator/loop_state.py
        - .maika/tools/microloop-orchestrator/loop_router.py
        - .maika/tools/microloop-orchestrator/loop_engineer.py
        - .maika/tools/microloop-orchestrator/orchestrator.py
      consumers: [.maika/tools/microloop-orchestrator/orchestrator.py]
    scope: {change_classes: [trivial, small]}
    scheduled_wave: W6
    reviewed_at: 2026-07-11

  - id: ENF-024
    mechanism: change-loop-repeated-failure
    type: gate
    status: active
    failure:
      classification: reproducible_litmus
      summary: >-
        A task still blocked after the retry budget is exhausted opens exactly one
        change loop (root_cause verification_gap → verification-specialist); a
        first/within-budget failure stays a micro loop with no LOOP.yaml. The
        orchestrator call site reuses the scope-escape-proven _observe_friction hook.
      litmus:
        command: /usr/bin/python3 -m pytest ".maika/tools/microloop-orchestrator/tests/test_loop_engineer.py" -q
    implementation:
      files:
        - .maika/tools/microloop-orchestrator/loop_policy.py
        - .maika/tools/microloop-orchestrator/loop_engineer.py
        - .maika/tools/microloop-orchestrator/orchestrator.py
      consumers: [.maika/tools/microloop-orchestrator/orchestrator.py]
    scheduled_wave: W6
    reviewed_at: 2026-07-11

  - id: ENF-025
    mechanism: change-loop-approval-gate
    type: gate
    status: active
    failure:
      classification: reproducible_litmus
      summary: >-
        A human-approval loop decision (e.g. scope expansion) may resume only
        with a trusted CLI-authored approval bound to the change/loop/decision;
        a missing, tampered, or agent-authored (source != cli-user-action)
        approval is rejected. Automatic decisions resume with no approval.
      litmus:
        command: /usr/bin/python3 -m pytest "cli/tests/test_loop_command.py" -q
    implementation:
      files:
        - .maika/tools/microloop-orchestrator/loop_governance.py
        - cli/commands/loop.py
      consumers: [cli/commands/loop.py, cli/maika.py]
