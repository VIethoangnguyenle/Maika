schema_version: 1
contract_version: 1
adrs:
  - ADR-001
  - ADR-002

run:
  lifecycle:
    states: [CREATED, ACTIVE, WAITING, BLOCKED, COMPLETED, FAILED, CANCELLED]
    terminal: [COMPLETED, FAILED, CANCELLED]
    transitions:
      CREATED: [ACTIVE, FAILED, CANCELLED]
      ACTIVE: [WAITING, BLOCKED, COMPLETED, FAILED, CANCELLED]
      WAITING: [ACTIVE, BLOCKED, FAILED, CANCELLED]
      BLOCKED: [ACTIVE, FAILED, CANCELLED]
      COMPLETED: []
      FAILED: []
      CANCELLED: []

  phase:
    states:
      - INTAKE
      - EXPLORING
      - RECONCILING
      - BRAINSTORMING
      - SPECIFYING
      - PLANNING
      - EXECUTING
      - REVIEWING
      - VERIFYING
      - ARCHIVING
    transitions:
      INTAKE: [EXPLORING, PLANNING, EXECUTING]
      EXPLORING: [RECONCILING, BRAINSTORMING]
      RECONCILING: [BRAINSTORMING]
      BRAINSTORMING: [SPECIFYING]
      SPECIFYING: [PLANNING]
      PLANNING: [EXECUTING]
      EXECUTING: [REVIEWING, VERIFYING]
      REVIEWING: [VERIFYING, ARCHIVING]
      VERIFYING: [REVIEWING, ARCHIVING]
      ARCHIVING: []

  valid_combinations:
    CREATED: [INTAKE]
    ACTIVE: [INTAKE, EXPLORING, RECONCILING, BRAINSTORMING, SPECIFYING, PLANNING, EXECUTING, REVIEWING, VERIFYING, ARCHIVING]
    WAITING: [INTAKE, EXPLORING, RECONCILING, BRAINSTORMING, SPECIFYING, PLANNING, EXECUTING, REVIEWING, VERIFYING, ARCHIVING]
    BLOCKED: [INTAKE, EXPLORING, RECONCILING, BRAINSTORMING, SPECIFYING, PLANNING, EXECUTING, REVIEWING, VERIFYING, ARCHIVING]
    COMPLETED: [ARCHIVING]
    FAILED: [INTAKE, EXPLORING, RECONCILING, BRAINSTORMING, SPECIFYING, PLANNING, EXECUTING, REVIEWING, VERIFYING, ARCHIVING]
    CANCELLED: [INTAKE, EXPLORING, RECONCILING, BRAINSTORMING, SPECIFYING, PLANNING, EXECUTING, REVIEWING, VERIFYING, ARCHIVING]

  aggregate_version:
    initial: 1
    accepted_mutation_increment: 1
    rejected_or_noop_increment: 0

worker:
  states: [DISPATCHED, STARTING, RUNNING, WAITING, BLOCKED, SUCCEEDED, FAILED, TIMED_OUT, CANCELLED]
  active: [DISPATCHED, STARTING, RUNNING]
  terminal: [BLOCKED, SUCCEEDED, FAILED, TIMED_OUT, CANCELLED]
  transitions:
    DISPATCHED: [STARTING, FAILED, CANCELLED]
    STARTING: [RUNNING, WAITING, FAILED, TIMED_OUT, CANCELLED]
    RUNNING: [WAITING, BLOCKED, SUCCEEDED, FAILED, TIMED_OUT, CANCELLED]
    WAITING: [STARTING, RUNNING, BLOCKED, FAILED, TIMED_OUT, CANCELLED]
    BLOCKED: []
    SUCCEEDED: []
    FAILED: []
    TIMED_OUT: []
    CANCELLED: []

aggregation:
  precedence:
    - COMPLETED
    - FAILED
    - ACTIVE
    - BLOCKED
    - WAITING
    - ERROR
  error: NO_PROGRESS_CLASSIFICATION
