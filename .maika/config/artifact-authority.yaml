# Artifact authority registry — MỘT authority cho mỗi agent-facing decision.
# Khác với artifact-registry.yaml (audit vòng đời file source-tree): file này trả lời
# "artifact nào là nguồn sự thật khi agent cần quyết định X trong lúc chạy task".
# Đường dẫn tương đối với framework root; `<change-id>` = workspace đang active.
# Consumer cơ học: `maika content validate-authority` (cli/agent_content/authority.py).
version: 1

authorities:
  current_change:
    source: changes/<change-id>/CHANGE.yaml
  current_state:
    source: changes/<change-id>/STATE.yaml
  intent:
    source: changes/<change-id>/INTENT.md
  exploration:
    source: changes/<change-id>/exploration/
  reconciliation:
    source: changes/<change-id>/RECONCILIATION.md
  specification:
    source: changes/<change-id>/SPEC.md
  implementation_plan:
    source: changes/<change-id>/IMPLEMENTATION_PLAN.md
  task_queue:
    source: changes/<change-id>/generated/TASK_QUEUE.json
  dispatch_log:
    source: changes/<change-id>/generated/DISPATCH_LOG.jsonl
  verification:
    source: changes/<change-id>/verification/VERIFICATION_REPORT.md
  # Vị trí hiện hành; PR 7 (bootstrap split) sẽ chuyển sang runtime/BOOTSTRAP_ENV_REPORT.yaml
  # + runtime/AGENT_BOOTSTRAP_ACK.yaml và cập nhật entry này.
  bootstrap_report:
    source: knowledge/active/BOOTSTRAP_REPORT.yaml
  durable_knowledge:
    source: knowledge/long-term/
  archive:
    source: archive/<change-id>/

# Legacy active-memory artifacts: KHÔNG còn là authority cho bất kỳ decision nào.
# replacement null = discard (không có successor).
deprecated:
  - path: knowledge/active/REQUIREMENT.md
    replacement: changes/<change-id>/INTENT.md
  - path: knowledge/active/EXPLORE_CONTEXT.md
    replacement: changes/<change-id>/exploration/
  - path: knowledge/active/AGENT_TRANSPARENCY.md
    replacement: changes/<change-id>/generated/DISPATCH_LOG.jsonl
  - path: knowledge/active/TOKEN_LOG.md
    replacement: null
  - path: knowledge/active/ideation/
    replacement: changes/<change-id>/RECONCILIATION.md
