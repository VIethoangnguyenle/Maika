version: 1

authority:
  exact_current_source:
    authoritative: current-source
  structured_graph_trace:
    preferred: understand-anything
    corroborating: [codebase-memory-mcp, current-source]
    conflict_action: verify_current_source
  semantic_index_structure:
    preferred: codebase-memory-mcp
    corroborating: understand-anything
    conflict_action: verify_current_source
  semantic_symbol_resolution:
    preferred: serena
    corroborating: [current-source, understand-anything]
    conflict_action: verify_current_source
  operational_maintenance:
    preferred: serena
    evidence_eligible: false
  domain_semantics:
    preferred: understand-anything
    corroborating: current-source
    conflict_action: mark_inferred_or_conflicting
  historical_context:
    preferred: agent-memory
    conflict_action: treat_as_candidate
  canonical_project_knowledge:
    authoritative: maika-knowledge-kernel

providers:
  understand-anything:
    display_name: Understand-Anything MCP
    kind: structured_code_graph
    setup_ref: understand-anything
    tool_contract:
      tools:
        - list_projects
        - get_graph_stats
        - get_graph_metadata
        - get_tour
        - query_nodes
        - get_node_detail
        - get_node_source
        - get_relationships
        - trace_call_chain
        - get_layer_info
        - find_entry_points
        - find_impact
        - find_path
        - get_class_hierarchy
        - search_by_file_path
        - get_domain_overview
        - get_domain_detail
        - get_domain_flow_detail
    capabilities:
      primary: [architecture_discovery, domain_flow_trace, call_chain_trace, impact_analysis, graph_path_trace, inheritance_trace]

  codebase-memory-mcp:
    display_name: Codebase Memory MCP
    kind: semantic_code_index
    setup_ref: codebase-memory-mcp
    tool_contract:
      tools:
        - index_repository
        - search_graph
        - query_graph
        - trace_path
        - get_code_snippet
        - get_graph_schema
        - get_architecture
        - search_code
        - list_projects
        - delete_project
        - index_status
        - detect_changes
        - manage_adr
        - ingest_traces
      capabilities:
        semantic_code_search:
          tool: search_graph
          argument: semantic_query
          argument_type: array
      lanes:
        discovery:
          tools: [list_projects, index_status, get_graph_schema, search_graph, trace_path, detect_changes, query_graph, get_code_snippet, get_architecture, search_code]
          mutability: read_only
        explicit_index:
          tools: [index_repository]
          activation: explicit_index_request
          mutability: local_index_write
        explicit_graph_mutation:
          tools: [manage_adr, ingest_traces]
          activation: explicit_user_request
          mutability: graph_write
        destructive_admin:
          tools: [delete_project]
          activation: explicit_user_request
          confirmation_required: true
          mutability: destructive
    capabilities:
      primary: [semantic_code_search]
      supporting: [architecture_discovery, call_chain_trace, impact_analysis]

  serena:
    display_name: Serena
    kind: semantic_language_server
    setup_ref: serena
    tool_contract:
      tools: [get_symbols_overview, find_symbol, find_referencing_symbols, find_implementations, find_declaration, get_diagnostics_for_file, get_diagnostics_for_symbol, restart_language_server]
      lanes:
        discovery:
          tools: [get_symbols_overview, find_symbol, find_referencing_symbols, find_implementations, find_declaration, get_diagnostics_for_file, get_diagnostics_for_symbol]
          mutability: read_only
        maintenance:
          tools: [restart_language_server]
          mutability: operational
          evidence_eligible: false
    capabilities:
      primary: [symbolic_code_navigation, code_diagnostics, operational_maintenance]

  current-source:
    display_name: Current Source
    kind: local_authority
    synthetic: true
    capabilities:
      primary: [exact_source_inspection]
    authoritative_for: [exact_code_fact, exact_application_behavior]

  db-access:
    display_name: DB Access
    kind: database
    configured_externally: true
    client_config_key: db-access
    tool_contract:
      tools:
        - list_databases
        - sql_list_tables
        - sql_get_columns
        - sql_get_constraints
        - sql_read
        - sql_write
        - sql_execute_script
        - mongo_list_collections
        - mongo_get_schema
        - mongo_read
        - mongo_write
      lanes:
        exploration:
          source_capabilities: [read]
          tools: [list_databases, sql_list_tables, sql_get_columns, sql_get_constraints, mongo_list_collections, mongo_get_schema]
          mutability: read_only
        data_probe:
          source_capabilities: [read]
          tools: [sql_read, mongo_read]
          activation: explicit_runtime_data_question
          mutability: read_only
        explicit_write:
          source_capabilities: [write]
          tools: [sql_write, mongo_write]
          activation: explicit_user_request
          provider_confirmation_required: true
          mutability: write
        explicit_script:
          source_capabilities: [script]
          tools: [sql_execute_script]
          activation: explicit_user_request
          provider_confirmation_required: true
          mutability: write
    capabilities:
      primary: [database_schema_inspection]
      supporting: [database_dependency_analysis]

  confluence:
    display_name: Confluence
    kind: document_index
    setup_ref: confluence
    capabilities:
      supporting: [business_knowledge_retrieval]

  agent-memory:
    display_name: Agent Memory
    kind: episodic_memory
    setup_ref: agent-memory
    integration_mode: mcp_proxy_only
    fallback_policy: reject_store_change
    hooks:
      auto_capture: false
      session_injection: false
      stop_summary: false
    authoritative_for: [historical_session_fact, previous_decision_reference, prior_user_preference, prior_failure_or_attempt]
    not_authoritative_for: [exact_current_code, exact_current_business_rule, authorization, canonical_project_knowledge]
    agent_id_semantics: retrieval_filter_only
    tool_contract:
      tools:
        - memory_smart_search
        - memory_recall
        - memory_sessions
        - memory_save
        - memory_governance_delete
      required_tools: [memory_smart_search, memory_recall, memory_sessions]
      lanes:
        recall:
          tools: [memory_smart_search, memory_recall, memory_sessions]
          mutability: read_only
        explicit_memory_write:
          tools: [memory_save]
          activation: explicit_framework_decision
          mutability: memory_write
        destructive:
          tools: [memory_governance_delete]
          activation: explicit_user_request
          confirmation_required: true
          mutability: destructive
    capabilities:
      primary: [historical_context_retrieval]
      supporting: [business_knowledge_retrieval]
