# Declares the active micro-loop execution tier for THIS platform.
# The ONLY place platform-specifics live. Change one line to retarget.
#   subagent      → tier Agent-tool (tùy chọn cho Claude Code; đổi execution_mode nếu muốn)
#   fresh-session → Cursor / Antigravity (worker context mới per task, tự động qua worker_command)
#   inline-reload → fallback single-session (LCD; always works)
{% if platform.name == "antigravity" %}
execution_mode: fresh-session
# Worker dùng-một-lần. Prompt được truyền qua argv (shell=False, cross-platform);
# placeholder hợp lệ: {prompt} {prompt_file} {repo_root} {workspace} {task_id}.
worker:
  executable: agy
  args: ["--add-dir", "{repo_root}", "--dangerously-skip-permissions", "--prompt-file", "{prompt_file}"]
{% elif platform.name == "codex" %}
execution_mode: fresh-session
worker:
  executable: codex
  args: ["exec", "--sandbox", "workspace-write", "--prompt-file", "{prompt_file}"]
{% elif platform.name == "claude-code" %}
execution_mode: fresh-session
worker:
  executable: claude
  args: ["-p", "--dangerously-skip-permissions", "--prompt-file", "{prompt_file}"]
{% else %}
execution_mode: inline-reload
worker: {}
{% endif %}
max_retries: 2
worker_timeout_seconds: 900

# vNext W7: canonical engine; legacy execution paths are no longer scaffold defaults.
workflow_engine: vnext

token_budget:
  version: 1
  trivial: {max_context_tokens: 8000, max_worker_calls: 1, max_evidence_items: 5}
  small: {max_context_tokens: 20000, max_worker_calls: 2, max_evidence_items: 12}
  standard: {max_context_tokens: 60000, max_worker_calls: 6, max_evidence_items: 30}
  architectural: {max_context_tokens: 120000, max_worker_calls: 12, max_evidence_items: 60}

command_policy:
  version: 1
  allowed_profiles: [python-version, pytest-paths, gradle-test, gradle-build, maika-ci]
  allowed_executables: [./gradlew, gradlew, mvn, pytest, python, python3, npm, pnpm, go, cargo, git]
  requires_human_confirmation: [docker, kubectl, terraform, flyway, liquibase]
  timeout_seconds: 600
  output_cap_bytes: 2000
