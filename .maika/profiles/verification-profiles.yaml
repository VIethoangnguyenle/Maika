version: 1

profiles:
  python-version:
    executable: python
    fixed_args: [--version]
    allowed_parameters: {}
    category: test

  pytest-paths:
    executable: pytest
    fixed_args: []
    allowed_parameters:
      paths:
        type: path-list
        must_be_inside_repo: true
      tests:
        flag: -k
        type: string
        pattern: "^[A-Za-z0-9_ .:-]+$"
    category: test

  gradle-test:
    executable: ./gradlew
    fixed_args: [test]
    allowed_parameters:
      tests:
        flag: --tests
        type: list
        pattern: "^[A-Za-z0-9_.$*:-]+$"
    category: test

  gradle-build:
    executable: ./gradlew
    fixed_args: [build, --no-daemon]
    allowed_parameters: {}
    category: build

  maika-ci:
    executable: python
    fixed_args: [scripts/run_ci.py]
    allowed_parameters: {}
    trusted_repo_paths: [scripts/run_ci.py]
    category: test
