version: 1
capabilities:
  architecture_discovery:
    description: Khám phá module, boundary và flow kiến trúc.
    tools: [search_code, graph_stats, index_code]
    primary_provider: understand-anything
    supporting_providers: [codebase-memory-mcp]
    freshness: [code_index]
    preferred_evidence: [architecture_node, domain_node, domain_flow, relationship_edge, document_node]
  exact_source_inspection:
    description: Đọc source/symbol hiện tại với thẩm quyền tối cao (authoritative).
    tools: [get_symbol, read_file]
    freshness: [code_index]
    authoritative_for: [exact_code_fact]
    primary_provider: current-source
    preferred_evidence: [file_symbol, source_range, test_symbol, configuration_entry, exact_code_fact]
  dependency_analysis:
    description: Truy vết dependency path và phạm vi ảnh hưởng (blast radius).
    tools: [trace_flow, get_dependencies]
    freshness: [code_index]
    preferred_evidence: [symbol_node, dependency_path, call_path, blast_radius, code_graph_edge]
    primary_provider: codebase-memory-mcp
    supporting_providers: [understand-anything, current-source]
    compatibility_aggregate: true
  domain_flow_trace:
    description: Truy vết domain flow có cấu trúc từ graph.
    tools: [get_domain_overview, get_domain_detail, get_domain_flow_detail]
    freshness: [code_graph]
    primary_provider: understand-anything
    supporting_providers: [current-source]
    preferred_evidence: [domain_node, domain_flow, relationship_edge, exact_code_fact]
  call_chain_trace:
    description: Truy vết call chain và relationship edge có cấu trúc.
    tools: [query_nodes, trace_call_chain, get_relationships, get_node_source]
    freshness: [code_graph]
    primary_provider: understand-anything
    supporting_providers: [codebase-memory-mcp, current-source]
    preferred_evidence: [symbol_node, call_path, relationship_edge, exact_code_fact]
  impact_analysis:
    description: Tìm blast radius và consumer của node thay đổi.
    tools: [find_impact, get_relationships, get_node_source]
    freshness: [code_graph]
    primary_provider: understand-anything
    supporting_providers: [codebase-memory-mcp, current-source]
    preferred_evidence: [blast_radius, relationship_edge, exact_code_fact]
  graph_path_trace:
    description: Tìm path có cấu trúc giữa hai graph node.
    tools: [find_path]
    freshness: [code_graph]
    primary_provider: understand-anything
    preferred_evidence: [dependency_path, relationship_edge]
  inheritance_trace:
    description: Truy vết class hierarchy và source liên quan.
    tools: [get_class_hierarchy, get_node_source]
    freshness: [code_graph]
    primary_provider: understand-anything
    supporting_providers: [current-source]
    preferred_evidence: [symbol_node, relationship_edge, exact_code_fact]
  semantic_code_search:
    description: Tìm semantic anchor khi tên hoặc graph anchor chưa rõ.
    tools: [semantic_search]
    freshness: [code_index]
    primary_provider: codebase-memory-mcp
    supporting_providers: [understand-anything]
    preferred_evidence: [file_symbol, symbol_node, code_graph_edge]
  historical_context_retrieval:
    description: Truy hồi incident cũ, quyết định trước, rejected approach và review pattern lặp lại.
    tools: [dynamic_memory_recall, dynamic_memory_search]
    health: [dynamic_memory]
    preferred_evidence: [memory_reference, incident_reference, decision_reference, rejected_approach, review_pattern]
  business_knowledge_retrieval:
    description: Truy hồi tri thức sản phẩm, domain, tài liệu và memory.
    tools: [search_docs, dynamic_memory_recall]
    health: [dynamic_memory]
    preferred_evidence: [business_rule, business_document, domain_flow]
  convention_retrieval:
    description: Truy hồi Author DNA, conventions và rule ID.
    tools: [read_file, search_text]
    preferred_evidence: [author_dna_rule, convention_rule]
  database_schema_inspection:
    description: Kiểm tra database, table, column, constraint và Mongo collection/schema bằng tool DB Access hiện có.
    tools: [db_list_databases, db_list_tables, db_get_columns, db_get_constraints]
    health: [database]
    primary_provider: db-access
    preferred_evidence: [database_object, database_column, database_constraint]
  database_dependency_analysis:
    description: Phân tích dependency DB trong phạm vi metadata provider hiện có; consumer code phải verify bằng current source.
    tools: [db_get_constraints]
    health: [database]
    preferred_evidence: [database_dependency, sql_consumer]
  runtime_verification:
    description: Chạy lệnh build/test/lint/verification thật và đọc output.
    tools: [run_command, command_status]
    preferred_evidence: [command_result, test_result, runtime_probe]
  version_control:
    description: Đọc và ghi bằng chứng version-control (commit SHA, diff, trạng thái).
    tools: [run_command]
    preferred_evidence: [commit_ref, diff_ref, vcs_status]
  task_dispatch:
    description: Dispatch một task implementation theo worker contract chung.
    platform_capability: task_dispatch
  review_dispatch:
    description: Dispatch task review hoặc final review theo reviewer contract chung.
    platform_capability: review_dispatch

# Trigger vocabulary cho capabilities.conditional trong skill contract (plan
# Computational Harness §8). Validator: cli/agent_content/skill_contract.py —
# conditional capability phải khai trigger thuộc vocabulary này; trigger không
# được skill nào tiêu thụ bị test R1 chặn (cli/tests/test_structured_trace_skills.py).
triggers:
  unresolved_anchor:
    description: Anchor/symbol không resolve được từ tên hoặc graph node hiện có.
  ambiguous_semantic_query:
    description: Câu hỏi ngôn ngữ tự nhiên mơ hồ, chưa map được vào anchor cụ thể.
  graph_gap:
    description: Structured traversal thiếu relationship/node kỳ vọng.
  relevant_graph_stale:
    description: File liên quan trực tiếp đã đổi sau graph commit (freshness scoped).
  hidden_consumer_risk:
    description: Nghi ngờ consumer ẩn (reflection, config, event wiring) ngoài structured trace.
  dynamic_wiring_risk:
    description: Wiring động (DI/reflection/event) khiến static trace không đủ.
  reviewer_counter_evidence:
    description: Reviewer cần bằng chứng đối chứng độc lập cho một claim material.
  ua_unavailable:
    description: UA provider unavailable/invalid/degraded theo probe thật.
  database_code_consumer_gap:
    description: Cần map code consumer cho DB object ngoài phạm vi constraint metadata.
  persistence_change:
    description: Change chạm persistence (entity/repository/SQL/migration/transaction/locking).
  database_dependency_risk:
    description: Rủi ro dependency DB (FK/routine/package) cần constraint metadata.
  blast_radius_required:
    description: Câu hỏi scope/risk yêu cầu blast radius/impact tường minh.
