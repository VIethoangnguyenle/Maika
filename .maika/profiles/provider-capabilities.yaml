version: 1
providers:
  understand-anything:
    freshness_probe:
      tool: get_graph_metadata
    capabilities:
      architecture_discovery:
        role: primary
        tools: [get_graph_stats, get_tour, get_layer_info, get_relationships]
      domain_flow_trace:
        role: primary
        tools: [get_domain_overview, get_domain_detail, get_domain_flow_detail]
      call_chain_trace:
        role: primary
        tools: [query_nodes, trace_call_chain, get_relationships, get_node_source]
      impact_analysis:
        role: primary
        tools: [find_impact, get_relationships, get_node_source]
      graph_path_trace:
        role: primary
        tools: [find_path]
      inheritance_trace:
        role: primary
        tools: [get_class_hierarchy, get_node_source]
      semantic_code_search:
        role: supporting

  codebase-memory-mcp:
    capabilities:
      semantic_code_search:
        role: primary
        tools: [search_graph]
        argument_contract:
          semantic_query: {type: array, min_items: 1}
      architecture_discovery:
        role: supporting
      call_chain_trace:
        role: supporting
      impact_analysis:
        role: supporting
      dependency_analysis:
        role: primary
        tools: [query_graph]

  serena:
    capabilities:
      symbolic_code_navigation:
        role: primary
        tools: [get_symbols_overview, find_symbol, find_referencing_symbols, find_implementations, find_declaration]
      code_diagnostics:
        role: primary
        tools: [get_diagnostics_for_file, get_diagnostics_for_symbol, restart_language_server]

  current-source:
    capabilities:
      exact_source_inspection:
        role: primary
        authoritative_for: [exact_code_fact]
      domain_flow_trace:
        role: supporting
      call_chain_trace:
        role: supporting
      impact_analysis:
        role: supporting
      inheritance_trace:
        role: supporting

  db-access:
    capabilities:
      database_schema_inspection:
        role: primary
      database_dependency_analysis:
        role: supporting
