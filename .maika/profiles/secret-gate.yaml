# secret-gate.yaml — write-side mechanical secret protection (P0)
# Read by hooks/write-gate/write_gate.py:load_secret_config.
# High-precision, write-side only. Design:
#   docs/superpowers/specs/2026-07-20-secret-gate-design.md
version: 1
enabled: true

# Scanner-error behaviour. block = fail-closed (deny the write on a scanner bug);
# allow = fail-open (permit + warn) for pipelines that cannot tolerate a stall.
on_error: block

# Detection rules. Corpus is data — disable per id without touching code.
# Any rule absent from this map defaults to enabled.
rules:
  private-key:        {enabled: true}
  aws-access-key:     {enabled: true}
  gcp-sa-key:         {enabled: true}
  jwt:                {enabled: true}
  github-token:       {enabled: true}
  slack-token:        {enabled: true}
  stripe-live:        {enabled: true}
  generic-assignment: {enabled: true}

# Per-repo exceptions. Each entry needs a real `reason` (audit trail).
# - path_glob + rule_ids: exempt those rules under matching artifact paths.
# - path_glob alone: exempt all rules under that path.
# - rule_ids alone: exempt those rules anywhere.
allowlist: []
