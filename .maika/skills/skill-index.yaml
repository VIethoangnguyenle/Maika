# TỰ ĐỘNG TẠO BỞI generate_index.py - KHÔNG CHỈNH SỬA THỦ CÔNG
skills:
  -
    name: architecture-reconciler
    version: '2.0'
    description: >
      Dùng khi gói grounding đã có evidence đa nguồn cần đối chiếu: dựng claim matrix
      giữa UA/CBM/source/memory/DB/durable knowledge, phân loại và giải quyết conflict
      theo thứ tự authority trước khi brainstorming/spec.
  -
    name: author-dna-builder
    version: '2.0'
    description: >
      Dùng khi review lặp lại một triết lý kỹ thuật hoặc user xác nhận nguyên tắc định
      hướng: quản lý candidate lifecycle của Author DNA với confidence, provenance,
      positive/counterexample, scope, enforcement mapping, supersession và consumer list.
  -
    name: convention-intelligence-builder
    version: '2.0'
    description: >
      Dùng khi onboarding, sau refactor lớn, hoặc khi review lộ convention gap: trích
      convention cụ thể (naming/structure/testing/boundary) từ verified source với evidence
      threshold, examples/counterexamples, applies-to tags, scope matcher, enforcement type.
  -
    name: database-explorer
    version: '1.0'
    description: >
      Dùng khi change chạm persistence (entity, repository, native SQL, table, column,
      index, constraint, package, procedure, migration, transaction, locking, job/outbox,
      audit): probe DB read-only và phát ra DATABASE_CONTEXT.yaml có evidence hoặc degradation.
  -
    name: executing-task
    version: '2.0'
    description: >
      Dùng khi một task PENDING trong TASK_QUEUE.json sẵn sàng chạy: đọc brief +
      knowledge capsule, verify freshness, re-read source anchor, chỉ implement scope
      đã khai, và request re-grounding khi source khác evidence.
  -
    name: grounded-brainstorming
    version: '2.0'
    description: >
      Dùng khi reconciliation READY và change có nhiều thiết kế khả dĩ: so sánh các
      approach dựa trên evidence đã reconcile, mỗi approach kèm extension seam, blast
      radius, convention, historical failure, DB/migration/security impact và lý do loại.
  -
    name: grounding-explorer
    version: '2.0'
    description: >
      Dùng khi một change hạng standard/architectural cần thu thập bằng chứng trước
      thiết kế: điều phối truy xuất đa nguồn (kiến trúc, dependency, source, lịch sử,
      DB, convention), ghi evidence có provenance, phát hiện conflict và trả readiness.
  -
    name: infra-tdd
    version: '2.0'
    description: >
      Dùng khi CHANGE.yaml class architectural và change cần operational architecture:
      thu infra evidence (K8s topology, deployment manifest, service graph, Kafka
      topic/group, DB capacity/index, log/metric, incident memory, rollout/rollback command).
  -
    name: intent-analysis
    version: '2.0'
    description: >
      Dùng khi một request/ticket mới vào hoặc workspace resume thiếu INTENT.md:
      recall lịch sử, tra Author DNA/convention, tìm source touchpoint, nhận diện tín
      hiệu rủi ro, phân loại change và sinh QUERY_PLAN.yaml trước khi thiết kế.
  -
    name: knowledge-curator
    version: '2.0'
    description: >
      Dùng khi cần vận hành vòng đời tri thức (trước/trong/sau implementation) theo bốn
      mode retrieve/record/reconcile/curate: promote verified knowledge, supersede stale,
      save episodic memory, update DNA/convention, regenerate index, trigger graph refresh.
  -
    name: reviewing-change
    version: '2.0'
    description: >
      Dùng khi mọi task review đã pass và trước verification: review toàn change, kiểm
      integration/deleted-reference/verification, và ghi KNOWLEDGE_IMPACT.yaml (stale
      knowledge, superseded decision, new candidate, graph refresh, memory save).
  -
    name: reviewing-task
    version: '2.0'
    description: >
      Dùng khi một task result qua result-contract gate: review độc lập tìm
      counter-evidence — kiểm ít nhất một source anchor cho mỗi material behavior,
      public contract, deleted file, persistence/async/security boundary, incident, convention.
  -
    name: validating-plan
    version: '2.0'
    description: >
      Dùng khi writing-plan tạo IMPLEMENTATION_PLAN.md và trước khi compile/dispatch:
      kiểm hai tầng — mechanical (metadata/hash/anchor/DAG/AC/write-scope/capsule) và
      knowledge integrity (freshness/provider obligation/DNA/convention/incident/DB/conflict).
  -
    name: verification-before-completion
    version: '2.0'
    description: >
      Dùng khi sắp tuyên bố hoàn thành task/wave/change hoặc trước archive: chạy lệnh thật
      (build/test/static/contract/migration/smoke/deleted-scan/hash/freshness/DB), ghi
      command+expected+observed+exit+timestamp+interpretation, không complete bằng marker.
  -
    name: writing-plan
    version: '2.0'
    description: >
      Dùng khi SPEC.md đã duyệt và state là PLANNING: kiểm precondition, targeted
      re-grounding, dựng implementation graph (contract→producer→consumer→migration→
      verification→cleanup), phân rã task có write scope + evidence + AC + knowledge capsule.
  -
    name: writing-spec
    version: '2.0'
    description: >
      Dùng khi reconciliation/brainstorming đã xong và cần SPEC.md class-aware: map
      requirement→evidence, delta current→desired, behavior/state model, contract
      ownership, persistence/async/security impact, AC test được và evidence coverage.
