# TỰ ĐỘNG TẠO BỞI generate_index.py - KHÔNG CHỈNH SỬA THỦ CÔNG
skills:
  -
    name: architecture-reconciler
    version: '1.0'
    description: >
      Reconcile current behavior, desired behavior, evidence conflicts, and viable
      extension seams before Maika vNext brainstorming or specification begins.
  -
    name: author-dna-builder
    version: '1.0'
    description: >
      Build and maintain Author DNA for Maika vNext by turning recurring confirmed
      engineering philosophy into durable guidance used by planning and review.
  -
    name: convention-intelligence-builder
    version: '1.0'
    description: >
      Build and maintain Maika vNext convention intelligence by extracting recurring
      concrete naming, structure, testing, and boundary patterns from verified
      source evidence.
  -
    name: executing-task
    version: '1.0'
    description: >
      Execute exactly one immutable Maika vNext task brief in a fresh isolated
      context, producing structured YAML results with commands, changed files,
      changed symbols, deviations, concerns, and commit evidence.
  -
    name: grounded-brainstorming
    version: '1.0'
    description: >
      Compare grounded solution approaches after reconciliation, using verified
      evidence and project conventions while avoiding ungrounded implementation
      detail or provider-specific tool instructions.
  -
    name: grounding-explorer
    version: '1.0'
    description: >
      Build the three-lens grounding package for Maika vNext by collecting verified
      codebase, business, and convention evidence before any final architecture or
      implementation plan is written.
  -
    name: infra-tdd
    version: '1.0'
    description: >
      Produce infrastructure technical design documents for Maika vNext when a
      change requires explicit operational architecture, decision records,
      verification strategy, and rollback planning.
  -
    name: intent-analysis
    version: '1.0'
    description: >
      Classify an incoming request into a Maika vNext change class, create or update
      CHANGE.yaml and INTENT.md, and decide which reasoning phases are required
      before specification or implementation may proceed.
  -
    name: knowledge-curator
    version: '1.0'
    description: >
      Curate Maika vNext knowledge after verified completion by extracting reusable
      lessons, updating durable knowledge stores, regenerating indexes, and archiving
      the change workspace.
  -
    name: reviewing-change
    version: '1.0'
    description: >
      Perform final whole-change review for Maika vNext after task reviews complete,
      checking integration, deleted references, verification evidence, and unresolved
      findings before completion.
  -
    name: reviewing-task
    version: '1.0'
    description: >
      Review one Maika vNext task result against its immutable brief, changed diff,
      tests, declared write scope, and structured evidence without modifying
      application code.
  -
    name: validating-plan
    version: '1.0'
    description: >
      Independently validate Maika vNext IMPLEMENTATION_PLAN.md against SPEC.md,
      grounding evidence, source anchors, acceptance criteria, and deterministic
      compilation requirements before execution can begin.
  -
    name: verification-before-completion
    version: '1.0'
    description: >
      Verify Maika vNext completion claims with fresh commands, observed output,
      deleted-reference scans, scaffold checks, and recorded evidence before archive
      or final status is allowed.
  -
    name: writing-plan
    version: '1.0'
    description: >
      Write Maika vNext IMPLEMENTATION_PLAN.md from an approved SPEC.md and evidence
      manifest, producing deterministic task sections with exact files, anchors,
      tests, commands, expected results, and write scope.
  -
    name: writing-spec
    version: '1.0'
    description: >
      Write class-aware Maika vNext SPEC.md from grounded evidence and reconciliation,
      including acceptance criteria, evidence references, and required ASCII diagrams
      for flow, state, integration, callback, job, or data-path changes.
