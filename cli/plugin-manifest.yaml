# Maika Plugin Manifest
# Each plugin is a unit of framework content that gets scaffolded into target projects.
# Plugins can be:
#   - static (copy as-is)
#   - template (render with Jinja2 using platform context)
#   - directory (copy entire directory)
#
# requires_capability: if set, plugin is only included when user selects
# an MCP server providing that capability.

version: "3.0"

# ═══════════════════════════════════════════════════════════
# MCP Capabilities — which MCP server provides what
# ═══════════════════════════════════════════════════════════
mcp_capabilities:
  codebase-memory-mcp:
    provides: code_exploration
    display: "Codebase Memory — Knowledge graph + semantic search (single binary)"
    setup:
      engine_check:
        default: { kind: path_exists, path: "{home}/.local/bin/codebase-memory-mcp" }
      install_hint:
        default: "curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh | bash -s -- --skip-config   # installs the binary to ~/.local/bin; --skip-config so it does not overwrite Maika's scaffolded skills/hooks. Then wire the server below."
      index_hint: "Ask the agent: 'Index this project' (runs index_repository). To auto-index on connect: `codebase-memory-mcp config set auto_index true`."
      server:
        command: "codebase-memory-mcp"
        args: []

  confluence:
    provides: document_search
    display: "Confluence — Wiki/document search"

  db-remote:
    provides: db_access
    display: "DB Remote — Database schema exploration (read-only)"

  understand-anything:
    provides: code_exploration
    display: "Understand Anything — Knowledge Graph (primary for architecture/domain/flow; Codebase Memory extracts logic)"
    setup:
      graph_artifacts:
        - { name: code,   path: ".understand-anything/knowledge-graph.json", gen_cmd: "/understand" }
        - { name: domain, path: ".understand-anything/domain-graph.json",   gen_cmd: "/understand-domain" }
      engine_check:
        claude-code: { kind: file_contains, path: "{home}/.claude/plugins/installed_plugins.json", needle: "understand-anything@" }
        codex:       { kind: path_exists,   path: "{home}/.agents/skills/understand" }
        antigravity: { kind: path_exists,   path: "{home}/.gemini/antigravity/skills/understand-anything" }
        default:     { kind: path_exists,   path: "{home}/.understand-anything/repo" }
      install_hint:
        claude-code: "/plugin marketplace add Egonex-AI/Understand-Anything -> /plugin install understand-anything"
        default:     "curl -fsSL https://raw.githubusercontent.com/Egonex-AI/Understand-Anything/main/install.sh | bash -s {platform}"
      server:
        command: "uv"
        args: ["--directory", "{ua_mcp_dir}", "run", "server.py"]
        env: { PROJECT_ROOTS: "{project_root}" }

  agent-memory:
    provides: memory
    display: "Agent Memory — Kinh nghiệm dài hạn (agentmemory, tham khảo sau task)"

# ═══════════════════════════════════════════════════════════
# Supported Languages
# ═══════════════════════════════════════════════════════════
languages:
  - java
  - typescript
  - python
  - go
  - csharp
  - other

# ═══════════════════════════════════════════════════════════
# Plugins
# ═══════════════════════════════════════════════════════════
plugins:

  # ─── AGENT KERNEL ───
  # Rendered into the host entrypoint managed block (always-on constitution).
  - name: agents-md
    type: kernel-entrypoint
    source: agent/KERNEL.md
    template: false
    output: "{{ platform.config_entry_point }}"

  # Canonical kernel file in the target tree (hash/ack reference).
  - name: agent-kernel
    type: kernel
    source: agent/KERNEL.md
    template: false
    output: "{{ platform.framework_root }}/agent/KERNEL.md"

  # ─── RULES (mostly static) ───
