# Maika Plugin Manifest
# Each plugin is a unit of framework content that gets scaffolded into target projects.
# Plugins can be:
#   - static (copy as-is)
#   - template (render with Jinja2 using platform context)
#   - directory (copy entire directory)
#
# requires_capability: if set, plugin is only included when user selects
# an MCP server providing that capability.

version: "3.0"

# ═══════════════════════════════════════════════════════════
# MCP Capabilities — which MCP server provides what
# ═══════════════════════════════════════════════════════════
mcp_capabilities:
  codebase-memory-mcp:
    provides: code_exploration
    display: "Codebase Memory — Knowledge graph + semantic search (single binary)"
    setup:
      engine_check:
        default: { kind: path_exists, path: "{home}/.local/bin/codebase-memory-mcp" }
      install_hint:
        default: "curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh | bash -s -- --skip-config   # installs the binary to ~/.local/bin; --skip-config so it does not overwrite Maika's scaffolded skills/hooks. Then wire the server below."
      index_hint: "Ask the agent: 'Index this project' (runs index_repository). To auto-index on connect: `codebase-memory-mcp config set auto_index true`."
      server:
        command: "codebase-memory-mcp"
        args: []

  confluence:
    provides: document_search
    display: "Confluence — Wiki/document search"

  db-remote:
    provides: db_access
    display: "DB Remote — Database schema exploration (read-only)"

  understand-anything:
    provides: code_exploration
    display: "Understand Anything — Knowledge Graph (primary for architecture/domain/flow; Codebase Memory extracts logic)"
    setup:
      graph_artifacts:
        - { name: code,   path: ".understand-anything/knowledge-graph.json", gen_cmd: "/understand" }
        - { name: domain, path: ".understand-anything/domain-graph.json",   gen_cmd: "/understand-domain" }
      engine_check:
        claude-code: { kind: file_contains, path: "{home}/.claude/plugins/installed_plugins.json", needle: "understand-anything@" }
        codex:       { kind: path_exists,   path: "{home}/.agents/skills/understand" }
        antigravity: { kind: path_exists,   path: "{home}/.gemini/antigravity/skills/understand-anything" }
        default:     { kind: path_exists,   path: "{home}/.understand-anything/repo" }
      install_hint:
        claude-code: "/plugin marketplace add Egonex-AI/Understand-Anything -> /plugin install understand-anything"
        default:     "curl -fsSL https://raw.githubusercontent.com/Egonex-AI/Understand-Anything/main/install.sh | bash -s {platform}"
      server:
        command: "uv"
        args: ["--directory", "{ua_mcp_dir}", "run", "server.py"]
        env: { PROJECT_ROOTS: "{project_root}" }

  agent-memory:
    provides: memory
    display: "Agent Memory — Kinh nghiệm dài hạn (agentmemory, tham khảo sau task)"

# ═══════════════════════════════════════════════════════════
# Supported Languages
# ═══════════════════════════════════════════════════════════
languages:
  - java
  - typescript
  - python
  - go
  - csharp
  - other

# ═══════════════════════════════════════════════════════════
# Plugins
# ═══════════════════════════════════════════════════════════
plugins:

  # ─── META-PROMPT ───
  - name: agents-md
    type: meta-prompt
    source: meta-prompt.md
    template: false
    output: "{{ platform.config_entry_point }}"

  # ─── RULES (mostly static) ───
  - name: rules-manifest
    type: rule
    source: rules/RULES.md
    template: false
    output: "{{ platform.framework_root }}/rules/RULES.md"

  - name: rules-flow
    type: rule
    source: rules/rules-flow.md
    template: false
    output: "{{ platform.framework_root }}/rules/rules-flow.md"

  - name: rules-tool
    type: rule
    source: rules/rules-tool.md
    template: false
    output: "{{ platform.framework_root }}/rules/rules-tool.md"

  - name: rules-exec
    type: rule
    source: rules/rules-exec.md
    template: false
    output: "{{ platform.framework_root }}/rules/rules-exec.md"

  - name: rules-knowledge
    type: rule
    source: rules/rules-knowledge.md
    template: false
    output: "{{ platform.framework_root }}/rules/rules-knowledge.md"

  - name: rules-guard
    type: rule
    source: rules/rules-guard.md
    template: false
    output: "{{ platform.framework_root }}/rules/rules-guard.md"

  # ─── SKILLS ───
  - name: requirement-analyst
    type: skill
    source: skills/requirement-analyst/
    template: false
    output: "{{ platform.framework_root }}/skills/requirement-analyst/"
    copy_dir: true

  - name: spec-extract
    type: skill
    source: skills/spec-extract/
    template: false
    output: "{{ platform.framework_root }}/skills/spec-extract/"
    copy_dir: true

  - name: db-explorer
    type: skill
    source: skills/db-explorer/
    template: false
    output: "{{ platform.framework_root }}/skills/db-explorer/"
    copy_dir: true
    requires_capability: db_access

  - name: codebase-explorer
    type: skill
    source: skills/codebase-explorer/
    template: false
    output: "{{ platform.framework_root }}/skills/codebase-explorer/"
    copy_dir: true
    requires_capability: code_exploration

  - name: architecture-reviewer
    type: skill
    source: skills/architecture-reviewer/
    template: false
    output: "{{ platform.framework_root }}/skills/architecture-reviewer/"
    copy_dir: true

  - name: knowledge-curator
    type: skill
    source: skills/knowledge-curator/
    template: false
    output: "{{ platform.framework_root }}/skills/knowledge-curator/"
    copy_dir: true

  - name: convention-intelligence-builder
    type: skill
    source: skills/convention-intelligence-builder/
    template: false
    output: "{{ platform.framework_root }}/skills/convention-intelligence-builder/"
    copy_dir: true

  - name: author-dna-builder
    type: skill
    source: skills/author-dna-builder/
    template: false
    output: "{{ platform.framework_root }}/skills/author-dna-builder/"
    copy_dir: true

  - name: spec-validator
    type: skill
    source: skills/spec-validator/
    template: false
    output: "{{ platform.framework_root }}/skills/spec-validator/"
    copy_dir: true

  - name: document-writer
    type: skill
    source: skills/document-writer/
    template: false
    output: "{{ platform.framework_root }}/skills/document-writer/"
    copy_dir: true

  - name: infra-tdd
    type: skill
    source: skills/infra-tdd/
    template: false
    output: "{{ platform.framework_root }}/skills/infra-tdd/"
    copy_dir: true

  - name: openspec-explore
    type: skill
    source: skills/openspec-explore/
    template: false
    output: "{{ platform.framework_root }}/skills/openspec-explore/"
    copy_dir: true

  - name: openspec-propose
    type: skill
    source: skills/openspec-propose/
    template: false
    output: "{{ platform.framework_root }}/skills/openspec-propose/"
    copy_dir: true

  - name: openspec-archive-change
    type: skill
    source: skills/openspec-archive-change/
    template: false
    output: "{{ platform.framework_root }}/skills/openspec-archive-change/"
    copy_dir: true

  # ─── WORKFLOWS ───
  - name: workflow-task
    type: workflow
    source: workflows/task.md
    template: false
    output: "{{ platform.framework_root }}/workflows/task.md"

  - name: workflow-idea-to-task
    type: workflow
    source: workflows/idea-to-task.md
    template: false
    output: "{{ platform.framework_root }}/workflows/idea-to-task.md"

  - name: workflow-index-source
