  # ─── KNOWLEDGE LAYER TEMPLATES ───
  - name: knowledge-templates
    type: template
    source: knowledge-templates/
    template: false
    output: "{{ platform.framework_root }}/knowledge/templates/"
    copy_dir: true

  - name: knowledge-active-skeleton
    type: template
    source: knowledge-active/
    template: false
