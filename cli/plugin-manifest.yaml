    template: false
    output: "{{ platform.framework_root }}/procedures/bootstrap.md"

  - name: context-loader
    type: procedure
    source: procedures/context-loader.md
    template: false
    output: "{{ platform.framework_root }}/procedures/context-loader.md"

  - name: context-compressor
    type: procedure
    source: procedures/context-compressor.md
    template: false
    output: "{{ platform.framework_root }}/procedures/context-compressor.md"

  - name: token-tracking
    type: procedure
