name: CI

on:
  push:
    branches: [main, master-v2]
  pull_request:

env:
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + test deps
        run: python -m pip install -e ".[test]"
      - name: Run test suite
        run: python scripts/run_ci.py

  install-ps1-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fresh install into temp project (headless)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\demo" | Out-Null
          .\install.ps1 "$env:RUNNER_TEMP\demo" -Yes -Platform claude-code -Language python
      - name: Assert Windows-rendered artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path ".venv\Scripts\maika.exe")) { throw "maika.exe missing - editable install broke" }
          $settings = Get-Content "$env:RUNNER_TEMP\demo\.claude\settings.json" -Raw
          if ($settings -match '/usr/bin/python3') { throw "Unix python path leaked into Windows hooks" }
          if ($settings -match '\$\(git rev-parse') { throw "Unix shell substitution leaked into Windows hooks" }
          if ($settings -notmatch 'maika\.write-gate\.v1') { throw "canonical write-gate hook id missing" }
          if ($settings -notmatch 'maika hook write-gate') { throw "canonical write-gate command missing" }
          if ($settings -notmatch '--platform claude-code') { throw "write-gate platform arg missing" }
          if (-not (Test-Path "$env:RUNNER_TEMP\demo\.maika\runtime\platforms\claude-code.yaml")) { throw "canonical runtime profile missing" }
      - name: Bare update preserves launcher (regression 1A, E2E)
        shell: pwsh
        run: |
          & .venv\Scripts\python.exe -m cli.maika update --target "$env:RUNNER_TEMP\demo"
          if ($LASTEXITCODE -ne 0) { throw "maika update failed" }
          $settings = Get-Content "$env:RUNNER_TEMP\demo\.claude\settings.json" -Raw
          if ($settings -match '/usr/bin/python3') { throw "update re-rendered Unix hooks on Windows" }

  install-linux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fresh install into temp project (headless)
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          ./install.sh "$RUNNER_TEMP/demo" --yes --platform claude-code --language python
      - name: Assert Linux-rendered artifacts
        run: |
          settings="$RUNNER_TEMP/demo/.claude/settings.json"
          test -f "$settings" || { echo "settings.json missing"; exit 1; }
          grep -q 'maika\.write-gate\.v1' "$settings" || { echo "canonical write-gate hook id missing"; exit 1; }
          grep -q 'maika hook write-gate' "$settings" || { echo "canonical write-gate command missing"; exit 1; }
          grep -q -- '--platform claude-code' "$settings" || { echo "write-gate platform arg missing"; exit 1; }
          grep -q 'py -3' "$settings" && { echo "Windows launcher leaked into Linux hooks"; exit 1; }
          test -f "$RUNNER_TEMP/demo/.maika/runtime/platforms/claude-code.yaml" || { echo "canonical runtime profile missing"; exit 1; }
      - name: Bare update preserves the canonical hook (E2E)
        run: |
          ./install.sh "$RUNNER_TEMP/demo"
          grep -q 'maika hook write-gate' "$RUNNER_TEMP/demo/.claude/settings.json" \
            || { echo "update dropped the canonical hook"; exit 1; }
